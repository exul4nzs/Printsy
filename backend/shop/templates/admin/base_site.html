{% extends "admin/base.html" %}
{% load static %}

{% block branding %}
<h1 id="site-name"><a href="{% url 'admin:index' %}">💎 Printsy Studio Admin</a></h1>
{% endblock %}

{% block extrastyle %}
{{ block.super }}
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest"></script>

<style>
    /* Premium Design System */
    :root {
        --primary: #10b981; /* Emerald 500 */
        --primary-dark: #059669;
        --bg-deep: #0a0a0a;
        --bg-card: #171717;
        --bg-surface: #262626;
        --fg-main: #f5f5f5;
        --fg-muted: #a3a3a3;
        --border: #333333;
        --accent: #3b82f6; /* Blue 500 */
        --glass: rgba(23, 23, 23, 0.7);
    }

    /* Reset & Typography */
    body {
        font-family: 'Outfit', sans-serif !important;
        background-color: var(--bg-deep) !important;
        color: var(--fg-main) !important;
    }

    /* Header / Nav */
    #header {
        background: var(--bg-card) !important;
        border-bottom: 1px solid var(--border) !important;
        padding: 10px 20px !important;
        display: flex;
        align-items: center;
        justify-content: space-between;
    }

    #branding h1 {
        font-weight: 700 !important;
        letter-spacing: -0.5px;
        color: var(--primary) !important;
        margin: 0;
    }

    #user-tools {
        color: var(--fg-muted) !important;
        text-transform: none !important;
        font-weight: 500 !important;
    }

    #user-tools a {
        color: var(--fg-main) !important;
        transition: color 0.2s;
    }

    #user-tools a:hover {
        color: var(--primary) !important;
    }

    /* Sidebar / Navigation */
    #nav-sidebar {
        background: var(--bg-deep) !important;
        border-right: 1px solid var(--border) !important;
        width: 260px !important;
    }

    .nav-sidebar-section {
        border-bottom: 1px solid var(--border) !important;
    }

    .nav-sidebar-section caption {
        background: transparent !important;
        color: var(--fg-muted) !important;
        font-weight: 700 !important;
        text-transform: uppercase;
        font-size: 10px !important;
        letter-spacing: 2px;
        padding: 20px 16px 10px !important;
    }

    .nav-sidebar-section a {
        color: var(--fg-muted) !important;
        transition: all 0.2s;
        padding: 10px 16px !important;
        font-size: 13px !important;
        border-radius: 8px;
        margin: 2px 8px;
        display: block;
    }

    .nav-sidebar-section a:hover, .nav-sidebar-section .current-model a {
        color: var(--primary) !important;
        background: rgba(16, 185, 129, 0.08) !important;
    }

    /* Main Content Area */
    #content {
        background: var(--bg-deep) !important;
        padding: 30px 40px !important;
    }

    .module {
        background: var(--bg-card) !important;
        border: 1px solid var(--border) !important;
        border-radius: 12px !important;
        overflow: hidden;
        margin-bottom: 30px !important;
        box-shadow: 0 4px 20px rgba(0,0,0,0.2);
    }

    .module h2, .module caption {
        background: rgba(255,255,255,0.02) !important;
        color: var(--primary) !important;
        font-weight: 700 !important;
        text-transform: uppercase;
        letter-spacing: 1.5px;
        font-size: 11px !important;
        padding: 14px 20px !important;
        border-bottom: 1px solid var(--border) !important;
    }

    /* Tables */
    table {
        width: 100% !important;
        border-collapse: separate !important;
        border-spacing: 0 !important;
    }

    th {
        background: rgba(0,0,0,0.15) !important;
        color: var(--fg-muted) !important;
        font-size: 11px !important;
        font-weight: 700 !important;
        text-transform: uppercase;
        letter-spacing: 1px;
        padding: 14px 20px !important;
        border-bottom: 1px solid var(--border) !important;
    }

    td {
        padding: 16px 20px !important;
        border-bottom: 1px solid var(--border) !important;
        color: var(--fg-main) !important;
        font-size: 14px !important;
    }

    tr:hover td {
        background: rgba(255,255,255,0.015) !important;
    }

    /* Buttons */
    .button, input[type=submit], input[type=button], .submit-row input {
        background: var(--primary) !important;
        color: #000 !important;
        border: none !important;
        border-radius: 8px !important;
        padding: 10px 24px !important;
        font-weight: 700 !important;
        font-size: 13px !important;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        cursor: pointer;
        transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1) !important;
    }

    .button:hover, input[type=submit]:hover {
        background: #34d399 !important;
        transform: translateY(-2px);
        box-shadow: 0 8px 16px rgba(16, 185, 129, 0.25);
    }

    .button.default, input[type=submit].default {
        background: var(--primary) !important;
    }

    .button.deletelink {
        background: #ef4444 !important;
        color: #fff !important;
    }

    /* Forms */
    .form-row {
        border-bottom: 1px solid var(--border) !important;
        padding: 20px !important;
    }

    label {
        color: var(--fg-muted) !important;
        font-weight: 600 !important;
        font-size: 13px !important;
    }

    input[type=text], input[type=password], input[type=email], input[type=url], input[type=number], textarea, select {
        background: var(--bg-surface) !important;
        border: 1px solid var(--border) !important;
        color: var(--fg-main) !important;
        border-radius: 8px !important;
        padding: 10px 14px !important;
        width: 100%;
        max-width: 600px;
        transition: all 0.2s;
    }

    input:focus {
        border-color: var(--primary) !important;
        outline: none;
        box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.15);
        background: #2a2a2a !important;
    }

    /* Breadcrumbs */
    .breadcrumbs {
        background: transparent !important;
        border: none !important;
        color: var(--fg-muted) !important;
        padding: 0 0 24px 0 !important;
        font-size: 12px !important;
        font-weight: 500 !important;
    }

    .breadcrumbs a {
        color: var(--primary) !important;
        font-weight: 600 !important;
        text-decoration: none !important;
    }

    .breadcrumbs a:hover {
        text-decoration: underline !important;
    }

    /* Object Tools (Add buttons in changelist) */
    .object-tools {
        margin-bottom: 20px !important;
    }

    .object-tools a {
        background: var(--bg-surface) !important;
        color: var(--fg-main) !important;
        border: 1px solid var(--border) !important;
        border-radius: 8px !important;
        padding: 10px 16px !important;
        font-weight: 600 !important;
        font-size: 12px !important;
        text-transform: uppercase;
    }

    .object-tools a.addlink {
        background: var(--primary) !important;
        color: #000 !important;
        border: none !important;
    }

    /* Login Page Overrides */
    body.login {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
        background: radial-gradient(circle at center, #111 0%, #000 100%) !important;
    }

    .login #container {
        background: var(--bg-card) !important;
        border: 1px solid var(--border) !important;
        border-radius: 20px !important;
        width: 400px !important;
        padding: 40px !important;
        box-shadow: 0 20px 50px rgba(0,0,0,0.5) !important;
    }

    .login #header, .login .breadcrumbs { display: none !important; }

    .login h1 {
        text-align: center;
        margin-bottom: 30px !important;
    }

    /* Scrollbars */
    ::-webkit-scrollbar { width: 10px; height: 10px; }
    ::-webkit-scrollbar-track { background: var(--bg-deep); }
    ::-webkit-scrollbar-thumb { background: #333; border-radius: 10px; border: 2px solid var(--bg-deep); }
    ::-webkit-scrollbar-thumb:hover { background: #444; }

</style>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        if (typeof lucide !== 'undefined') {
            lucide.createIcons();
        }
    });
</script>
{% endblock %}
